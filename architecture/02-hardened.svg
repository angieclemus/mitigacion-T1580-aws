<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Arquitectura endurecida frente a T1580</title>
  <desc>Atacante externo con Pacu intenta enumerar pero es bloqueado por IAM, registrado por CloudTrail y detectado por alarmas de CloudWatch.</desc>
  <defs>
    <marker id="arrowBlocked" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Atacante externo -->
  <rect x="270" y="20" width="180" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="360" y="44" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A">Atacante externo</text>
  <text x="360" y="64" font-size="12" text-anchor="middle" fill="#444441">Maquina local + Pacu</text>

  <!-- Flecha intento bloqueado -->
  <line x1="360" y1="82" x2="360" y2="128" stroke="#3B6D11" stroke-width="1.8" marker-end="url(#arrowBlocked)" stroke-dasharray="6 3"/>
  <text x="375" y="108" font-size="12" fill="#3B6D11" font-weight="500">T1580 — intento bloqueado</text>

  <!-- Contenedor AWS Cloud -->
  <rect x="30" y="140" width="660" height="295" rx="14" fill="#EAF3DE" fill-opacity="0.35" stroke="#3B6D11" stroke-width="1" stroke-dasharray="7 4"/>
  <text x="50" y="164" font-size="14" font-weight="600" fill="#173404">AWS — cuenta Learner Lab</text>
  <text x="50" y="180" font-size="12" fill="#3B6D11">Configuracion endurecida</text>

  <!-- Capa de proteccion: IAM (primera barrera) -->
  <rect x="60" y="200" width="600" height="68" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="360" y="224" font-size="14" font-weight="600" text-anchor="middle" fill="#173404">IAM — primera barrera de control</text>
  <text x="360" y="246" font-size="12" text-anchor="middle" fill="#3B6D11">Minimo privilegio · MFA · Deny explicito a Describe* / List* / Get*</text>

  <!-- Servicios protegidos -->
  <rect x="60" y="285" width="285" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="202.5" y="309" font-size="14" font-weight="600" text-anchor="middle" fill="#04342C">Amazon EC2</text>
  <text x="202.5" y="328" font-size="12" text-anchor="middle" fill="#085041">IMDSv2 · SG minimo · SSM</text>

  <rect x="375" y="285" width="285" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="517.5" y="309" font-size="14" font-weight="600" text-anchor="middle" fill="#04342C">Amazon S3</text>
  <text x="517.5" y="328" font-size="12" text-anchor="middle" fill="#085041">Block Public Access · SSE · versionado</text>

  <!-- Capa de observabilidad -->
  <rect x="60" y="362" width="285" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="202.5" y="386" font-size="14" font-weight="600" text-anchor="middle" fill="#042C53">AWS CloudTrail</text>
  <text x="202.5" y="405" font-size="12" text-anchor="middle" fill="#0C447C">Trail multiregion · logs inmutables</text>

  <rect x="375" y="362" width="285" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="517.5" y="386" font-size="14" font-weight="600" text-anchor="middle" fill="#042C53">AWS CloudWatch</text>
  <text x="517.5" y="405" font-size="12" text-anchor="middle" fill="#0C447C">Alarmas sobre Describe* / List*</text>

  <!-- Flecha de flujo CloudTrail -> CloudWatch -->
  <line x1="345" y1="393" x2="372" y2="393" stroke="#185FA5" stroke-width="1.3" marker-end="url(#arrowFlow)"/>

  <!-- Resultado fuera del contenedor -->
  <rect x="160" y="448" width="400" height="14" rx="7" fill="none" stroke="none"/>

  <!-- Lateral: leyenda corta -->
</svg>
