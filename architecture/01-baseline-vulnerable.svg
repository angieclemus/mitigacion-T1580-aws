<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Arquitectura baseline vulnerable a T1580</title>
  <desc>Atacante externo con Pacu enumera con exito todos los servicios de AWS por la ausencia de controles.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Atacante externo -->
  <rect x="270" y="20" width="180" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="360" y="44" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A">Atacante externo</text>
  <text x="360" y="64" font-size="12" text-anchor="middle" fill="#444441">Maquina local + Pacu</text>

  <!-- Flecha + etiqueta -->
  <line x1="360" y1="82" x2="360" y2="128" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="375" y="108" font-size="12" fill="#A32D2D" font-weight="500">T1580 — enumeracion</text>

  <!-- Contenedor AWS Cloud -->
  <rect x="30" y="140" width="660" height="240" rx="14" fill="#FCEBEB" fill-opacity="0.35" stroke="#A32D2D" stroke-width="1" stroke-dasharray="7 4"/>
  <text x="50" y="164" font-size="14" font-weight="600" fill="#501313">AWS — cuenta Learner Lab</text>
  <text x="50" y="180" font-size="12" fill="#791F1F">Configuracion vulnerable</text>

  <!-- Servicio EC2 -->
  <rect x="60" y="200" width="295" height="68" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="207.5" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#501313">Amazon EC2</text>
  <text x="207.5" y="248" font-size="12" text-anchor="middle" fill="#791F1F">Security group abierto · SSH publico</text>

  <!-- Servicio S3 -->
  <rect x="365" y="200" width="295" height="68" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="512.5" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#501313">Amazon S3</text>
  <text x="512.5" y="248" font-size="12" text-anchor="middle" fill="#791F1F">Bucket publico · sin cifrado · sin versionado</text>

  <!-- Servicio IAM -->
  <rect x="60" y="285" width="295" height="68" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="207.5" y="311" font-size="14" font-weight="600" text-anchor="middle" fill="#501313">AWS IAM</text>
  <text x="207.5" y="333" font-size="12" text-anchor="middle" fill="#791F1F">Politica wildcard (*:*) · sin MFA</text>

  <!-- Servicio Observabilidad -->
  <rect x="365" y="285" width="295" height="68" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="512.5" y="311" font-size="14" font-weight="600" text-anchor="middle" fill="#501313">Observabilidad</text>
  <text x="512.5" y="333" font-size="12" text-anchor="middle" fill="#791F1F">Solo Event History · sin alarmas</text>

  <!-- Resultado -->
  <rect x="180" y="395" width="360" height="34" rx="17" fill="#A32D2D" stroke="#501313" stroke-width="1"/>
  <text x="360" y="416" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">Resultado: enumeracion exitosa de todos los servicios</text>
</svg>
